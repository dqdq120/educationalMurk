<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnglishMurk – Daily Word</title>
    <style>
        :root {
            --primary: #1a73e8;
            --primary-dark: #0d47a1;
            --bg: #f5f8fc;
            --card: #ffffff;
            --text: #222222;
            --muted: #666666;
            --border: #e2e8f0;
            --radius: 16px;
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            line-height: 1.6;
            padding-top: 80px;
        }

        /* ==== NAVBAR ==== */
        .navbar {
            position: fixed; top:0; left:0; width:100%; height:70px;
            background: rgba(255,255,255,.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0,0,0,.08);
            display:flex; align-items:center; justify-content:space-between;
            padding:0 5%;
            z-index:1000;
            transition: background .3s;
        }
        .navbar .logo { font-weight:700; font-size:1.6rem; color:var(--primary); }
        .navbar .logo span { color:var(--text); }
        .nav-links { display:flex; gap:2rem; list-style:none; }
        .nav-links a {
            color:var(--text); text-decoration:none; font-weight:500;
            position:relative; padding: .4rem 0;
        }
        .nav-links a::after {
            content:''; position:absolute; bottom:0; left:0;
            width:0; height:2px; background:var(--primary);
            transition:width .3s;
        }
        .nav-links a:hover { color:var(--primary); }
        .nav-links a:hover::after { width:100%; }

        /* ==== ONBOARDING ==== */
        #onboarding {
            position:fixed; inset:0; background:rgba(0,0,0,.9);
            display:flex; flex-direction:column; align-items:center;
            justify-content:center; color:#fff; text-align:center;
            padding:2rem; z-index:9999;
        }
        #onboarding h1 { font-size:2.4rem; margin-bottom:.8rem; }
        .tiers {
            display:grid; gap:1rem; max-width:900px; width:100%;
            grid-template-columns:repeat(auto-fit, minmax(170px,1fr));
        }
        .tier-card {
            background:#fff; color:#222; border-radius:var(--radius);
            padding:1.4rem; cursor:pointer; transition:transform .2s,box-shadow .2s;
            box-shadow:0 4px 12px rgba(0,0,0,.08);
        }
        .tier-card:hover { transform:translateY(-6px); box-shadow:0 10px 24px rgba(0,0,0,.15); }
        .tier-card h3 { color:var(--primary); margin-bottom:.4rem; }

        /* ==== MAIN APP ==== */
        #app { display:none; min-height:100vh; padding:1.5rem; }
        .container { max-width:860px; margin:auto; }

        /* ---- DAILY WORD ---- */
        .daily-card {
            background:var(--card); border-radius:var(--radius);
            overflow:hidden; box-shadow:0 8px 28px rgba(0,0,0,.08);
            animation: fadeIn .6s ease-out;
        }
        .daily-header {
            background:linear-gradient(135deg, var(--primary), var(--primary-dark));
            color:#fff; padding:3rem 2rem; text-align:center;
        }
        .daily-header h2 { font-size:2.5rem; margin-bottom:.4rem; font-weight:700; }
        .daily-header .pron { font-size:1.1rem; opacity:.9; }
        .daily-body { padding:2rem; }
        .meaning { margin-bottom:1.2rem; }
        .meaning h3 { color:var(--primary); margin-bottom:.4rem; font-size:1.25rem; }
        .examples ul { list-style:none; padding-left:0; }
        .examples li { padding:.5rem 0; border-bottom:1px solid var(--border); font-style:italic; color:var(--muted); }

        /* ---- SECONDARY WORDS ---- */
        .extra-section { margin-top:2.5rem; }
        .extra-grid {
            display:grid; gap:1rem;
            grid-template-columns:repeat(auto-fill, minmax(140px,1fr));
        }
        .extra-chip {
            background:#eef2ff; border-radius:12px; padding:.9rem 1rem;
            text-align:center; font-weight:600; color:var(--primary);
            cursor:default; position:relative; overflow:hidden;
            height:56px; display:flex; align-items:center; justify-content:center;
            transition: all .3s cubic-bezier(.2,.8,.4,1);
            animation: popIn .4s ease-out forwards;
            opacity:0; transform:scale(.9);
        }
        .extra-chip:nth-child(1) { animation-delay:.05s; }
        .extra-chip:nth-child(2) { animation-delay:.10s; }
        .extra-chip:nth-child(3) { animation-delay:.15s; }
        .extra-chip:nth-child(4) { animation-delay:.20s; }
        .extra-chip:nth-child(5) { animation-delay:.25s; }
        .extra-chip:nth-child(6) { animation-delay:.30s; }
        .extra-chip:nth-child(7) { animation-delay:.35s; }
        .extra-chip:nth-child(8) { animation-delay:.40s; }
        .extra-chip:nth-child(9) { animation-delay:.45s; }

        .extra-chip:hover {
            background:#dbeafe; height:auto; min-height:56px;
            transform:translateY(-4px); box-shadow:0 8px 20px rgba(26,115,232,.15);
            padding-bottom:1.2rem;
        }
        .extra-chip .def {
            margin-top:.8rem; font-weight:400; font-size:.9rem;
            color:#333; opacity:0; transform:translateY(-8px);
            transition:opacity .25s .1s, transform .25s .1s;
        }
        .extra-chip:hover .def { opacity:1; transform:none; }
        .extra-chip .example {
            margin-top:.5rem; font-style:italic; font-size:.82rem;
            color:var(--muted);
        }

        /* ==== ANIMATIONS ==== */
        @keyframes fadeIn { from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:none;} }
        @keyframes popIn { from{opacity:0; transform:scale(.85);} to{opacity:1; transform:scale(1);} }

        /* ==== LOADING ==== */
        .loading { text-align:center; padding:2rem; color:var(--muted); }

        @media (max-width:600px){
            .daily-header h2{font-size:2rem;}
            .extra-grid{grid-template-columns:repeat(3,1fr);}
        }
    </style>
</head>
<body>

<!-- ONBOARDING -->
<div id="onboarding">
    <h1>Choose Your Vocabulary Tier</h1>
    <p>Select how challenging you want your daily word to be.</p>
    <div class="tiers" id="tiers-container"></div>
</div>

<!-- MAIN APP -->
<div id="app">
    <nav class="navbar">
        <div class="logo">English<span>Murk</span></div>
        <ul class="nav-links">
            <li><a href="">Home</a></li>
            <li><a href="">Courses</a></li>
            <li><a href="">Practice</a></li>
            <li><a href="">Progress</a></li>
            <li><a href="">Community</a></li>
        </ul>
    </nav>

    <div class="container">
        <!-- DAILY WORD -->
        <section class="daily-card" id="daily-card">
            <header class="daily-header">
                <h2 id="word">Loading…</h2>
                <div class="pron" id="pronunciation"></div>
            </header>
            <div class="daily-body" id="word-body">
                <div class="loading">Fetching your daily word…</div>
            </div>
        </section>

        <!-- SECONDARY WORDS -->
        <section class="extra-section">
            <div class="extra-grid" id="extra-grid">
                <div class="loading">Loading more words…</div>
            </div>
        </section>
    </div>
</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script>
    // ---- Lucide icons (now loads properly) ----
    lucide.createIcons();

    // ==== CONFIG ====
    const TIERS = [
        { size: 5000,  label: "Top 5K",   file: "top5000_words.json" },
        { size: 10000, label: "Top 10K",  file: "top10000_words.json" },
        { size: 15000, label: "Top 15K",  file: "top15000_words.json" },
        { size: 20000, label: "Top 20K",  file: "top20000_words.json" },
        { size: 25000, label: "Top 25K",  file: "top25000_words.json" },
        { size: 30000, label: "Top 30K",  file: "top30000_words.json" },
        { size: 35000, label: "Top 35K",  file: "top35000_words.json" },
        { size: 40000, label: "Top 40K",  file: "top40000_words.json" }
    ];
    const API = "https://api.dictionaryapi.dev/api/v2/entries/en/";

    // ==== Seeded RNG (same day, different offset) ====
    function seededRand(max, offset = 0) {
        const d = new Date();
        const seed = Number(`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`) + offset;
        let t = seed + 0x6D2B79F5;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return Math.floor(((t ^ (t >>> 14)) >>> 0) / 4294967296 * (max + 1));
    }

    // ==== ONBOARDING ====
    const onboarding = document.getElementById('onboarding');
    const tiersDiv = document.getElementById('tiers-container');
    const app = document.getElementById('app');

    TIERS.forEach(t => {
        const el = document.createElement('div');
        el.className = 'tier-card';
        el.innerHTML = `<h3>${t.label}</h3><p>${t.size.toLocaleString()} words</p>`;
        el.onclick = () => {
            localStorage.setItem('tier', JSON.stringify(t));
            onboarding.style.display = 'none';
            app.style.display = 'block';
            loadContent(t);
        };
        tiersDiv.appendChild(el);
    });

    const saved = localStorage.getItem('tier');
    if (saved) {
        const t = JSON.parse(saved);
        onboarding.style.display = 'none';
        app.style.display = 'block';
        loadContent(t);
    }

    // ==== MAIN LOAD ====
    async function loadContent(tier) {
        const wordEl = document.getElementById('word');
        const pronEl = document.getElementById('pronunciation');
        const bodyEl = document.getElementById('word-body');
        const extraEl = document.getElementById('extra-grid');

        try {
            // ---- WORD LIST ----
            const listRes = await fetch(`../${tier.file}`);
            if (!listRes.ok) throw new Error('Word list missing');
            const words = await listRes.json();

            // ---- DAILY WORD ----
            const mainIdx = seededRand(words.length - 1);
            const mainWord = words[mainIdx].toLowerCase().trim();
            const used = new Set([mainIdx]);

            const mainDef = await fetch(API + mainWord).then(r => r.ok ? r.json() : null);
            wordEl.textContent = mainWord;
            pronEl.textContent = mainDef?.[0]?.phonetic || mainDef?.[0]?.phonetics?.[0]?.text || '';
            bodyEl.innerHTML = '';

            if (mainDef?.[0]) {
                mainDef[0].meanings.slice(0,3).forEach(m => {
                    const d = m.definitions[0];
                    if (!d) return;
                    const div = document.createElement('div');
                    div.className = 'meaning';
                    div.innerHTML = `<h3>${m.partOfSpeech}</h3><p>${d.definition}</p>`;
                    if (d.example) {
                        div.innerHTML += `<div class="examples"><ul><li>"${d.example}"</li></ul></div>`;
                    }
                    bodyEl.appendChild(div);
                });
            } else {
                bodyEl.innerHTML = `<p><em>No definition for "${mainWord}".</em></p>`;
            }

            // ---- 9 EXTRA WORDS ----
            extraEl.innerHTML = '';
            const extras = [];
            for (let i = 0; i < 9; i++) {
                let idx;
                do { idx = seededRand(words.length - 1, i + 1); } while (used.has(idx));
                used.add(idx);
                extras.push(words[idx].toLowerCase().trim());
            }

            const promises = extras.map(async w => {
                const data = await fetch(API + w).then(r => r.ok ? r.json() : null);
                const entry = data?.[0];
                const def = entry?.meanings?.[0]?.definitions?.[0]?.definition || '—';
                const ex  = entry?.meanings?.[0]?.definitions?.[0]?.example || '';

                const chip = document.createElement('div');
                chip.className = 'extra-chip';
                chip.innerHTML = `
                    <div class="word-title">${w}</div>
                    <div class="def">
                        ${def}
                        ${ex ? `<div class="example">"${ex}"</div>` : ''}
                    </div>
                `;
                extraEl.appendChild(chip);
            });

            await Promise.all(promises);

        } catch (e) {
            console.error(e);
            bodyEl.innerHTML = '<p style="color:red;">Failed to load content.</p>';
            extraEl.innerHTML = '<p style="color:red;grid-column:1/-1;">Failed to load extra words.</p>';
        }
    }
</script>

</body>
</html>
